# GET   /currencies	    Список валют
# GET   /currency/{code}	Валюта по коду
# POST  /currencies	    Добавить валюту
# GET   /exchangeRates	Список курсов
# GET   /exchangeRate/{codes}	Курс по паре
# POST  /exchangeRates	Добавить курс
# PATCH /exchangeRate/{codes}	Обновить курс
# GET   /exchange	        Конвертация

openapi: 3.0.3
info:
  title: Currency Exchange API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://localhost:80
    description: Docker (nginx proxy)

paths:
  /currencies:
    get:
      summary: Get all currencies

      responses:
        '200':
          description: List of all currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    post:
      summary: Create new currency
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Australian dollar
                code:
                  type: string
                  example: AUD
                sign:
                  type: string
                  example: A$
              required:
                - name
                - code
                - sign
      responses:
        '201':
          description: Currency created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Currency code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /currency/{code}:
    get:
      summary: Get currency by code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Currency found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'
        '400':
          description: currency code doesn't exist in path string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: currency not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL SERVER ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /exchangeRates:
    get:
      summary: Get all exchange pair
      #operationId: # где используем? для кодогенерации operationId: getAllExchangeRates можно использовать, что бы по спецификации создать контроллер слой?
      #parameters: тут вообще есть параметры? - нет их нет, параметры идут после амперсанда
      #required: false нужен только если есть обязательные параметры в теле uri или query
      responses:
        '200':
          description: List of all exchange pair
          content:
            application/json:
              schema:
                type: array #type: array + items.
                items:
                  $ref: '#/components/schemas/ExchangeRate'
        '500':
          description: INTERNAL SERVER ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    post:
      summary: Create new exchange pair
      #operationId: пока не нужен весь код уже написан вручную
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateExchangeRate'

      responses:
        '201':
          description: Exchange rate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Exchange rate pair already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'



  /exchangeRate/{codes}:
    get:
      summary: get concrete Exchange pair
      #operationId: ___
      parameters:
        # ← нужно описать path parameter {codes}
        - name: codes
          in: path
          required: true
          description: Currency pair code (USDRUB)
          schema:
            type: string
      responses:
        # ← нужны ответы: 200, 400, 404, 500
        '200':
          description: Exchange rate exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'

        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Exchange rate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: edit exist exchange rate
      parameters:
        # ← path parameter {codes}
        - name: codes
          in: path
          required: true
          description: Currency pair code (USDRUB)
          schema:
            type: string

      requestBody:
        # ← какой формат? какая схема для rate?
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - rate
              properties:
                rate:
                  type: number
                  format: double
                  example: 0.99

      responses:
        # ← какие коды: 200, 400, 404, 409, 500?
        '200':
          description: Exchange rate update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'

        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Exchange rate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'





  /exchange:
    get:
      #operationId: exchange
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: true
          schema:
            type: number
            format: double

      responses:
        '200':
          description: Успешная конвертация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResult'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Валюта не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:
  schemas:
    Currency:
      type: object
      required:
        - id
        - name
        - code
        - sign
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Australian dollar
        code:
          type: string
          example: AUD
        sign:
          type: string
          example: A$

    ExchangeRate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        baseCurrency:
          $ref: '#/components/schemas/Currency'
        targetCurrency:
          $ref: '#/components/schemas/Currency'
        rate:
          type: number
          format: double
      required:
        - id
        - baseCurrency
        - targetCurrency
        - rate

    CreateExchangeRate:
      type: object
      properties:
        baseCurrencyCode:
          type: integer
          format: int64
        targetCurrencyCode:
          type: integer
          format: int64
        rate:
          type: number
          format: double
      required:
        - baseCurrencyCode
        - targetCurrencyCode
        - rate

    ExchangeResult:
      type: object
      properties:
        amount:
          type: number
          format: double
        convertedAmount:
          type: number
          format: double
        baseCurrency:
          $ref: '#/components/schemas/Currency'
        targetCurrency:
          $ref: '#/components/schemas/Currency'
        rate:
          type: number
          format: double
      required: [ amount, convertedAmount, baseCurrency, targetCurrency, rate ]

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: INTERNAL SERVER ERROR


